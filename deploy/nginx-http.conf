# Render with scripts/render-deployment.py; review certificate and webroot first.
# Bootstrap port 80 before requesting the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    root @@STATIC_ROOT@@;
    index index.html;
    access_log off;
    client_max_body_size @@BODY_LIMIT@@;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        try_files $uri =404;
    }

    # Login and private messages become available after HTTPS is ready.
    location /api/ {
        return 503;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
