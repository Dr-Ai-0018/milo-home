# Render with scripts/render-deployment.py; review certificate and webroot first.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        try_files $uri =404;
    }

    location / {
        return 301 https://@@DOMAIN@@$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@DOMAIN@@;
    root @@STATIC_ROOT@@;
    index index.html;
    ssl_certificate @@CERTIFICATE@@;
    ssl_certificate_key @@CERTIFICATE_KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MiloTLS:1m;
    ssl_session_timeout 1d;
    access_log off;
    client_max_body_size @@BODY_LIMIT@@;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
