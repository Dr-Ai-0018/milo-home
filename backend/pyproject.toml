[project]
name = "milo-home"
version = "0.1.0"
description = "米洛在家的私密留言接口"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pwdlib[argon2]>=0.3,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
milo-home = "milo_home.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/milo_home"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
